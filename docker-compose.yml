services:
  lbp6000-printer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lbp6000-server
    restart: always
    privileged: true # 重要: USBデバイスへの直接アクセスのために必要
    network_mode: host # 複雑なポートマッピングなしでネットワーク上のプリンタを認識させるため
    volumes:
      - /dev/bus/usb:/dev/bus/usb # USBバスをマウント
      - cups-config:/etc/cups     # プリンタ設定を保持
      - cups-certs:/etc/cups/ssl  # 証明書を保持（オプション）
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cups-config:
  cups-certs: